services:
  db:
    image: mariadb:11
    container_name: portfolio-db
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${DATABASE_USER}
      MYSQL_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - portfolio-network
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  migrator:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder
    container_name: portfolio-migrator
    env_file:
      - ./server/.env.production
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: >
      sh -c "
        echo '🚀 Running Prisma migrations...' &&
        ./node_modules/.bin/prisma migrate deploy &&
        echo '🌱 Running idempotent database seed...' &&
        ./node_modules/.bin/prisma db seed &&
        echo '✅ Migrations and seeding completed'
      "
    depends_on:
      db:
        condition: service_healthy
    networks:
      - portfolio-network
    restart: 'no'
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  redis:
    image: redis:7-alpine
    container_name: portfolio-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks:
      - portfolio-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.50
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: portfolio-server
    restart: unless-stopped
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      PORT: ${PORT}
      DATABASE_HOST: db
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '${PORT}:5000'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - portfolio-network
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://server:5000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    cpus: 0.75
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET}
        VITE_SITE_URL: ${VITE_SITE_URL}
    env_file:
      - ./client/.env.production
    container_name: portfolio-client
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT}:80'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - portfolio-network
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://client/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 128m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  db-data:
    name: portfolio-db-data
  redis-data:
    name: portfolio-redis-data

networks:
  portfolio-network:
    driver: bridge
